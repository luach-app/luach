name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseding a branch's own CI is the point: pushing twice to a pull request should not leave the
# first run burning a runner. Superseding `main` is not: a run on main ends in a published image,
# and cancelling it mid-flight leaves `:main` on an older build with a green tick beside the merge
# that was meant to replace it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {contents: read}

# The fast checks gate a merge; the slower ones run on main, against what was published.
#
# A pull request runs `backend (3.12)` and `web`, nothing slower. Those two are the required status
# checks on main: rename a job and the branch protection together. A push to main runs them again,
# beside:
#
#   backend (3.13)   the tests on the next Python, through hatch's test matrix, so the interpreter
#                    is really 3.13 (lint and types are pinned to 3.12 and run in `backend (3.12)`)
#   publish          the images, built once and tagged with the commit: ghcr.io/<owner>/luach and
#                    ghcr.io/<owner>/luach-gmail-fake (the Gmail stand-in a test deployment's email
#                    door polls, fixtures/gmail-fake), each :<sha7> and :main
#   integration      the image publish just pushed, pulled by tag: it boots the way a hardened
#                    deployment runs it, then end to end over HTTP (ci/integration)
#
# publish waits for no test: a deployment that follows `main` gets the build a few minutes after
# the merge, and can read these jobs' results on the commit before it promotes the build further.
# <owner> is the repository's owner, so a fork publishes to its own namespace with nothing to set
# up. GITHUB_TOKEN is the only credential any job here uses, every job runs on a GitHub-hosted
# runner, and every action is pinned to a commit.
jobs:
  backend:
    name: backend (3.12)
    runs-on: ubuntu-latest
    # The tests' Postgres (tests/conftest.py): Postgres 16 in the C locale, the version and
    # collation the compose file runs. Each pytest worker gets a database of its own on it.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: luach
          # Trust: a throwaway container for the tests, so no credential to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U luach"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      LUACH_TEST_DATABASE_URL: postgresql://luach@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The image and hatch's envs install the lock files, so they must still be pyproject.toml
      # resolved: a dependency edited without `scripts/lock.sh` fails here, saying so.
      - name: the lock files match pyproject.toml
        run: pipx install uv==0.12.5 && scripts/lock.sh --check
      - run: pipx install hatch
      # From requirements-dev.lock (pyproject pre-install-commands): what the image ships.
      - run: hatch env create
      - run: hatch run lint
      - run: hatch run typecheck
      - run: hatch run cov

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The screens have tests, with a coverage floor: a regression fails here rather than in
      # someone's browser.
      - run: npm run coverage
      - run: npm run build

  backend-next:
    # Python 3.13, on main only: a pull request is gated on 3.12, the Python the image ships.
    # Through hatch's test matrix (pyproject [[tool.hatch.envs.test.matrix]]), so the interpreter is
    # really 3.13 and not the default env's 3.12 under another name.
    name: backend (3.13)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: luach
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U luach"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      LUACH_TEST_DATABASE_URL: postgresql://luach@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pipx install hatch
      - run: hatch run "test.py3.13:run"

  publish:
    # On main only, never on a pull request: a pull request's code gets no token that can write
    # packages. No `needs:` on the tests (see the top of this file).
    name: publish (${{ matrix.image }})
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: luach, context: ".", dockerfile: Dockerfile}
          - {image: luach-gmail-fake, context: fixtures/gmail-fake, dockerfile: fixtures/gmail-fake/Dockerfile}
    outputs:
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: the image's name and tag
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          # A registry path is lower case; an owner's name need not be.
          echo "ref=ghcr.io/${OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # One platform, the build's default provenance attestation, and the commit as the tag: the
      # tag says which commit an image came from, and the digest printed below is what a
      # deployment should pin, since a re-run on the same commit pushes the same tag over new bytes.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.ref }}:${{ steps.name.outputs.tag }},${{ steps.name.outputs.ref }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: say what was published
        env:
          REF: ${{ steps.name.outputs.ref }}
          TAG: ${{ steps.name.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "published $REF:$TAG@$DIGEST"
          echo "\`$REF:$TAG@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  integration:
    # The image publish pushed, not a rebuild: the bytes a deployment pulls. Its check is named
    # "integration / integration (image, end to end)" on the commit.
    needs: publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/integration.yml
    permissions: {contents: read, packages: read}
    with:
      tag: ${{ needs.publish.outputs.tag }}
