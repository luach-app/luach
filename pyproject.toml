[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "luach"
version = "0.1.0"
description = "A household calendar run by a governed agent, for a family to host itself."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # [postgresql] is the asyncpg driver behind tulip's PgMemory — what luach
    # remembers about a member, in the same Postgres as everything else.
    "tulip-agents[openai,postgresql]>=2.13.0",
    # The embedder for that memory: ONNX through fastembed, so recall survives a
    # rewording and no torch enters the image (src/luach/embeddings.py).
    "fastembed>=0.4",
    "openai>=1.40",
    "sqlalchemy>=2.1",
    # The store: Postgres through psycopg 3, its schema Alembic's (src/luach/migrations).
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "bcrypt>=4.1",
    "requests>=2.32",
    "google-auth>=2.30",
    "google-api-python-client>=2.140",
    "pywebpush>=2.0",
    "python-dateutil>=2.9",
    # Reading a work calendar as busy time: an iCalendar feed, with its
    # recurrences expanded properly rather than by hand.
    "icalendar>=6.0",
    "recurring-ical-events>=3.2",
    "webauthn>=2.0",
    # A school letter or a ticket sent as a PDF: its text, for the email scan.
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    # The suite runs across every core (`-n auto` in `cov`): ~500 tests, each with
    # its own database under tmp_path, so nothing is shared between workers.
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    # tests/test_release_pipeline.py reads the workflows.
    "pyyaml>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "types-python-dateutil",
]

[project.scripts]
luach-migrate = "luach.migrate:main"
luach = "luach.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/luach"]

# `hatch run check` is the one command: lint, format, types, tests with the
# coverage floor. CI runs exactly these scripts, so green locally is green there.
[tool.hatch.envs.default]
features = ["dev"]
python = "3.12"
installer = "uv"
# Every env starts as requirements-dev.lock, exactly (scripts/lock.sh), so the tests run on the
# versions the image ships (requirements.lock, the same pins). Installing luach and [dev] after
# it then changes nothing. After editing the dependencies above: scripts/lock.sh, and commit the
# locks; CI fails a change that forgot. A local env predates a lock change: hatch env prune.
pre-install-commands = ['"$HATCH_UV" pip install --require-hashes -r requirements-dev.lock']

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
cov = "pytest -n auto --cov --cov-report=term-missing {args}"
lint = ["ruff check src tests", "ruff format --check src tests"]
fmt = ["ruff format src tests", "ruff check --fix src tests"]
typecheck = "mypy src"
check = ["lint", "typecheck", "cov"]
serve = "python -m luach"
# A Postgres for the tests and `serve`, as luach-db runs (16, C locale), on the port the
# LUACH_TEST_DATABASE_URL default below names. Gone when stopped (`docker stop luach-pg`).
pg = """docker run -d --rm --name luach-pg -p 127.0.0.1:55437:5432 \
  -e POSTGRES_USER=luach -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=luach \
  -e POSTGRES_INITDB_ARGS='--locale=C --encoding=UTF8' mirror.gcr.io/library/postgres:16"""
migrate = "luach-migrate"
# A schema change, autogenerated from the models against `hatch run pg`'s database (migrated
# first): hatch run revision "add a column to boards"; then read it before committing.
revision = ["luach-migrate", "alembic -c alembic.ini revision --autogenerate -m {args}"]

[tool.hatch.envs.default.env-vars]
LUACH_TEST_DATABASE_URL = "{env:LUACH_TEST_DATABASE_URL:postgresql://luach@127.0.0.1:55437/postgres}"
LUACH_DATABASE_URL = "{env:LUACH_DATABASE_URL:postgresql://luach@127.0.0.1:55437/luach}"

[[tool.hatch.envs.test.matrix]]
python = ["3.12", "3.13"]

[tool.hatch.envs.test.scripts]
run = "pytest -n auto --cov --cov-report=term-missing {args}"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
# By directory: Alembic loads the migrations under names of its own, which a
# module-name source would count as never run.
source = ["src/luach"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
check_untyped_defs = true
warn_unreachable = true
warn_unused_ignores = false
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["luach", "tests"]
